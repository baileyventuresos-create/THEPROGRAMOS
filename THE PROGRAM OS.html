<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>THE PROGRAM OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout concept: the scorer's table — hard-edged panels, hairline rules, gym-tape yellow marks what matters, numbers in scoreboard mono. */
:root{
  --bg:#ECEEED; --surface:#F8F9F8; --sunk:#E2E5E3; --ink:#121514; --muted:#59625E; --line:#C7CDCA; --line-strong:#9AA39F;
  --tape:#F2C300; --tape-ink:#121514; --side:#121514; --side-ink:#ECEEED; --side-muted:#8E9893;
  --crit:#B8321C; --warn:#9A6410; --ok:#2B7349; --info:#2F5D86;
  --crit-bg:#F4DDD8; --warn-bg:#F3E7CF; --ok-bg:#D9EADF; --info-bg:#DCE6EF;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1110; --surface:#161A19; --sunk:#1D2221; --ink:#E7EBE9; --muted:#97A29D; --line:#2A312F; --line-strong:#46504C;
  --tape:#F2C300; --tape-ink:#121514; --side:#070908; --side-ink:#E7EBE9; --side-muted:#7D8883;
  --crit:#FF7A62; --warn:#E8B04E; --ok:#5FC98D; --info:#7EB3E6;
  --crit-bg:#3A1C16; --warn-bg:#352812; --ok-bg:#15301F; --info-bg:#172736; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1110; --surface:#161A19; --sunk:#1D2221; --ink:#E7EBE9; --muted:#97A29D; --line:#2A312F; --line-strong:#46504C;
  --tape:#F2C300; --tape-ink:#121514; --side:#070908; --side-ink:#E7EBE9; --side-muted:#7D8883;
  --crit:#FF7A62; --warn:#E8B04E; --ok:#5FC98D; --info:#7EB3E6;
  --crit-bg:#3A1C16; --warn-bg:#352812; --ok-bg:#15301F; --info-bg:#172736; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
a{color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:.005em;line-height:.95;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ---------- top strip ---------- */
.scenario{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 16px;background:var(--tape);color:var(--tape-ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.scenario b{font-weight:700}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .wm{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:24px;letter-spacing:.01em;line-height:1}
.brand .wm span{display:inline-block;background:var(--ink);color:var(--bg);padding:1px 5px 0;margin-right:3px}
.brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.roles{margin-left:auto;display:flex;border:1px solid var(--ink)}
.roles button{background:transparent;border:0;padding:7px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.roles button+button{border-left:1px solid var(--ink)}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- director shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100% - 90px)}
.side{background:var(--side);color:var(--side-ink);padding:18px 0;display:flex;flex-direction:column;gap:2px}
.side .grp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--side-muted);padding:14px 18px 4px}
.side button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 18px;font-family:var(--display);font-stretch:80%;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;border-left:3px solid transparent}
.side button:hover{background:rgba(255,255,255,.06)}
.side button[aria-current="page"]{border-left-color:var(--tape);background:rgba(255,255,255,.08)}
.side button .ct{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--side-muted);letter-spacing:0}
.side button .ct.hot{color:var(--tape)}
.side .foot{margin-top:auto;padding:16px 18px 0;font-family:var(--mono);font-size:10px;color:var(--side-muted);line-height:1.6;letter-spacing:.04em}
.main{min-width:0;padding-block:24px 64px;padding-inline:28px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.pagehead h1{font-size:44px;margin:4px 0 0}
.pagehead .lede{max-width:62ch;color:var(--muted);margin:6px 0 0}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:transparent;padding:7px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{opacity:.88}
.btn.tape{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.btn.ghost{border-color:var(--line-strong)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>.ph h3{margin:0;font-family:var(--display);font-stretch:78%;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.panel>.ph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel>.pb{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--line);margin:12px 0}

/* label system: what kind of truth is this? */
.lbl{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;white-space:nowrap;line-height:1.4;vertical-align:middle}
.lbl.locked{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl.v1{color:var(--ink)}
.lbl.assume{color:var(--muted);border-style:dashed}
.lbl.needdef{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.lbl.needval{color:var(--info);border-color:var(--info)}
.lbl.demo{color:var(--muted);border-style:dotted}
.lbl.draft{color:var(--warn);border-color:var(--warn)}
.lbl.crit{color:var(--crit)}
.lbl.ok{color:var(--ok)}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);padding:3px 8px;font-size:12px;background:var(--surface);line-height:1.3}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip:hover{border-color:var(--ink)}
.q{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.q i{width:8px;height:8px;display:inline-block;background:var(--qc,var(--ink))}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));border:1px solid var(--line);background:var(--surface)}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* exceptions */
.exc{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;padding:11px 16px 11px 0;border-bottom:1px solid var(--line);align-items:center}
.exc:last-child{border-bottom:0}
.exc .sev{align-self:stretch;background:var(--line-strong)}
.exc.crit .sev{background:var(--crit)} .exc.warn .sev{background:var(--warn)} .exc.info .sev{background:var(--info)}
.exc .t{font-weight:600}
.exc .d{color:var(--muted);font-size:12.5px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.status::before{content:"";width:7px;height:7px;background:var(--line-strong)}
.status.ok::before{background:var(--ok)} .status.live::before{background:var(--tape);outline:2px solid var(--tape);outline-offset:1px}
.status.warn::before{background:var(--warn)} .status.crit::before{background:var(--crit)}

/* library */
.libbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;min-width:0;display:flex;border:1px solid var(--ink);background:var(--surface)}
.search input{border:0;background:transparent;padding:9px 12px;flex:1;min-width:0;outline:none;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:3px}
.filters select,.field select,.field input,.field textarea{border:1px solid var(--line-strong);background:var(--surface);padding:7px 8px;font-size:13px;min-width:0;width:100%}
.field{display:flex;flex-direction:column;gap:4px}
.field textarea{min-height:64px;resize:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;position:relative}
.gcard:hover{border-color:var(--ink)}
.gcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard h4{margin:0;font-family:var(--display);font-stretch:74%;font-weight:850;font-size:21px;text-transform:uppercase;line-height:1}
.gcard .var{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.gcard .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-top:1px solid var(--line);padding-top:8px}
.gcard .meta div{font-family:var(--mono);font-size:11px}
.gcard .meta span{display:block;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.gcard .core{font-size:13px;color:var(--muted);margin:0}
.gcard .flags{display:flex;flex-wrap:wrap;gap:4px}
.varstrip{display:flex;gap:2px}
.varstrip i{flex:1;height:4px;background:var(--line)}
.varstrip i.hit{background:var(--ink)}
.stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--qc)}

/* game screen */
.game-hero{border:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) 300px}
.game-hero .l{padding:20px 22px;min-width:0}
.game-hero h1{font-size:54px;margin:6px 0 4px}
.game-hero .r{border-left:1px solid var(--line);background:var(--sunk);display:flex;align-items:center;justify-content:center;padding:10px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:1px solid var(--line)}
.specs>div{padding:10px 14px;border-right:1px solid var(--line)}
.specs .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.specs .v{font-family:var(--display);font-stretch:85%;font-weight:750;font-size:17px;text-transform:uppercase;line-height:1.15}
.varpick{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 0}
.sect{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.sect h5{margin:0;font-family:var(--display);font-stretch:78%;font-weight:850;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.sect p,.sect ul{margin:0;max-width:68ch}
.sect ul{padding-left:18px}
.sect li+li{margin-top:3px}
.generic{color:var(--muted)}
.generic::after{content:" · generic (same on all 400)";font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:transparent;padding:5px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{border-left:3px solid var(--tape);background:var(--sunk);padding:10px 12px;font-size:13px}
.note.crit{border-left-color:var(--crit)}
.note.info{border-left-color:var(--info)}
.flagrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.flagrow:last-child{border-bottom:0}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 300px;gap:16px;align-items:start}
.timeline{display:flex;height:30px;border:1px solid var(--ink);margin-bottom:12px;overflow:hidden}
.timeline div{border-right:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;overflow:hidden;white-space:nowrap;min-width:0;background:var(--surface)}
.timeline div:last-child{border-right:0}
.timeline div.filled{background:var(--ink);color:var(--bg)}
.block{border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.block.sel{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--tape)}
.block.over{border-color:var(--tape);background:var(--sunk)}
.block .bh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px dashed var(--line);cursor:pointer}
.block .bh input.bl{border:0;background:transparent;font-family:var(--display);font-stretch:80%;font-weight:800;text-transform:uppercase;font-size:15px;min-width:0;flex:1;padding:0}
.block .bh input.bm{width:44px;border:1px solid var(--line-strong);background:var(--bg);text-align:right;font-family:var(--mono);font-size:12px;padding:2px 4px}
.block .bb{padding:9px 10px;min-height:46px}
.block .slot-empty{border:1px dashed var(--line-strong);padding:10px;text-align:center;color:var(--muted);font-size:12px}
.block .rule{font-size:11.5px;color:var(--muted);margin-top:4px}
.phhd{border-left:4px solid var(--ink);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;margin:16px 0 6px}
.phhd .disp{font-size:20px}
.phhd.sm{margin:10px 0 2px;padding:4px 8px}.phhd.sm .disp{font-size:15px}
.rolec{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--ink);color:var(--bg);padding:2px 6px;vertical-align:middle;line-height:1.3}
.fitc{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:1px 6px;border:1px solid var(--line-strong);white-space:nowrap}
.fitc.f2{border-color:var(--ok);color:var(--ok)}.fitc.f1{border-color:var(--warn);color:var(--warn)}.fitc.f0{border-color:var(--crit);color:var(--crit)}
.pick.inel{opacity:.62}
details.why{margin-top:6px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px}
details.why summary{cursor:pointer;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary b::before{content:"+ ";font-family:var(--mono)}
details.why[open] summary b::before{content:"– "}
details.why ul{margin:6px 0 0;padding-left:18px}
.audit{border:1px solid var(--crit);background:var(--crit-bg);padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.wnext{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--tape);background:var(--sunk);padding:8px 10px}
.wnext b{font-size:14px}
.ccard{border-top:2px solid var(--ink)}
.crow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.crow .ck{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;padding-top:2px}
.crow .cues span{font-size:16px}
.cph{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);padding:12px 0 3px;border-bottom:1px solid var(--line-strong);text-transform:uppercase}
button.slot-empty{background:transparent;cursor:pointer;font:inherit;font-size:12px;color:var(--muted)}
.prog{margin-top:8px;padding:8px 10px;border-left:4px solid var(--tape);background:var(--sunk)}
.note.warn{border-color:var(--warn)}
.ingame{display:flex;gap:10px;align-items:flex-start}
.ingame .nm{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.05}
.warns{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.w{font-size:11.5px;display:flex;gap:6px;align-items:baseline}
.w::before{content:"▲";font-size:8px;color:var(--warn)}
.w.crit::before{color:var(--crit)}
.picker{max-height:640px;overflow:auto;border-top:1px solid var(--line)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:grab;background:var(--surface)}
.pick:hover{background:var(--sunk)}
.pick .nm{font-weight:600;font-size:13px}
.pick .mt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cov{display:grid;grid-template-columns:118px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:11.5px;margin-bottom:4px}
.cov .bar{height:8px;background:var(--sunk);position:relative}
.cov .bar i{position:absolute;inset:0 auto 0 0;background:var(--qc,var(--ink))}
.cov .n{font-family:var(--mono);text-align:right;font-size:11px}
.eq{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.eq:last-child{border-bottom:0}

/* lab */
/* rotation */
.rotgrid{display:grid;gap:6px}
.rg{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);padding:8px 10px}
.rg.on{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--tape)}
.rothead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tape);color:var(--tape-ink);padding:8px 10px;margin:4px 0 0;font-size:12.5px}
.rothead .btn{border-color:var(--tape-ink);color:var(--tape-ink)}
.block.rotblk{border-left:4px solid var(--tape)}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);min-width:0}

.lcard:hover{border-color:var(--ink)}
.lcard .nm{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:16px;text-transform:uppercase;line-height:1.05}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(640px,100%);height:100%;background:var(--bg);overflow:auto;border-left:2px solid var(--ink);padding:0 0 40px}
.drawer .dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;z-index:2}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-family:var(--mono);font-size:12px;z-index:90;max-width:calc(100% - 32px)}

/* ---------- phone modes ---------- */
.phone-stage{display:flex;justify-content:center;padding:24px 16px 48px;gap:32px;align-items:flex-start}
.phone{width:100%;max-width:410px;background:var(--bg);border:1px solid var(--line-strong);min-height:760px;display:flex;flex-direction:column;position:relative}
.phone-side{max-width:320px;padding-top:8px}

.phone-side p{color:var(--muted);font-size:13.5px}
.ph-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.ph-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.bigbtn{display:block;width:100%;border:0;background:var(--ink);color:var(--bg);padding:16px;font-family:var(--display);font-stretch:75%;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.bigbtn.tape{background:var(--tape);color:var(--tape-ink)}
.today-card{background:var(--ink);color:var(--bg);padding:16px}
.today-card .time{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
.today-card .who{font-family:var(--display);font-stretch:75%;font-weight:850;font-size:26px;text-transform:uppercase;line-height:1;margin-top:8px}
.plist .pi{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plist .pi .ix{font-family:var(--mono);font-size:12px;color:var(--muted)}
.plist .pi .nm{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.05}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.check .bx{width:22px;height:22px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900}
.check.on .bx{background:var(--ink);color:var(--bg)}
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rbtn{border:1px solid var(--line-strong);background:var(--surface);padding:9px 8px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:44px}
.rbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rbtn .fl{font-family:var(--mono);font-size:9px;background:var(--tape);color:var(--tape-ink);padding:1px 4px}
/* live */
.live-top{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.progress{display:flex;gap:3px;padding:8px 16px;background:var(--ink)}
.progress i{flex:1;height:5px;background:#3A403E}
.progress i.done{background:var(--bg)}
.progress i.cur{background:var(--tape)}
.timer{font-family:var(--mono);font-size:76px;font-weight:700;line-height:1;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer.over{color:var(--crit)}
.tctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px}
.tctrl button{border:1px solid var(--ink);background:var(--surface);padding:12px 4px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-height:48px}
.tctrl button.go{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.score .tm{border:1px solid var(--line-strong);padding:8px;text-align:center;background:var(--surface)}
.score .tm .n{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1}
.score .tm .b{display:flex;gap:6px;justify-content:center;margin-top:6px}
.score .tm .b button{width:44px;height:40px;border:1px solid var(--ink);background:transparent;font-size:20px;font-weight:700}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;padding:13px 0;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:16px;text-transform:uppercase;display:flex;justify-content:space-between;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--mono);font-weight:400}
.acc details[open] summary::after{content:"–"}
.acc .ab{padding:0 0 14px;font-size:14.5px}
.acc .ab ul{margin:0;padding-left:18px}
.acc .ab li+li{margin-top:4px}
.actbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-top:auto}
.actbar button{min-height:50px;border:1px solid var(--ink);background:transparent;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.actbar button.go{background:var(--ink);color:var(--bg)}
.rate{display:grid;gap:8px}
.rate button{border:1px solid var(--ink);background:var(--surface);padding:14px;text-align:left;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:19px;text-transform:uppercase}
.rate button.on{background:var(--ink);color:var(--bg)}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--bg);border-top:2px solid var(--ink);padding:16px;z-index:5;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-scrim{position:absolute;inset:0;background:rgba(10,12,11,.4);z-index:4}

/* athlete */
.ath-head{background:var(--ink);color:var(--bg);padding:18px 16px}
.ath-head h2{font-size:40px;margin:2px 0 6px}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--tape);font-weight:700}
.metric{border:1px solid var(--line);background:var(--surface);padding:12px}
.metric .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .mn{font-family:var(--display);font-stretch:78%;font-weight:850;font-size:17px;text-transform:uppercase}
.metric .vals{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;border-top:1px solid var(--line)}
.metric .vals div{padding:6px 0 0}
.metric .vals .m{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.metric .vals .x{font-family:var(--mono);font-size:20px;font-weight:700}
.metric .vals .pb{background:var(--tape);color:var(--tape-ink);padding:0 4px}
.layer{border:1px solid var(--line)}
.layer>.lh{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.layer>.lb{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.quote{font-size:14.5px;border-left:3px solid var(--ink);padding-left:10px}
.quote .by{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.mile{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mile .mk{font-family:var(--mono);font-size:18px;font-weight:700;text-align:center;border:2px solid var(--ink);padding:4px 0}
.dawg{font-family:var(--display);font-stretch:68%;font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase}

.ath-head .seg{border-color:var(--bg)}
.ath-head .seg button{color:var(--bg)}
.ath-head .seg button+button{border-left-color:var(--bg)}
.ath-head .seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.stack>.search{flex:none}
/* V2: builds, cues, template markers */
.bchip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--ink);background:transparent;color:var(--ink);line-height:1.3}
button.bchip{cursor:pointer}
button.bchip[disabled]{opacity:.3;cursor:not-allowed}
.bchip.on{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.buildtabs{display:flex;flex-wrap:wrap;gap:4px}
.bmini{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;border:1px solid var(--line-strong);color:var(--muted)}
.tmpl{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--warn);text-transform:none;font-weight:600;line-height:1.3}
.tmpl.crit{color:var(--crit)}
.cues{display:flex;flex-wrap:wrap;gap:6px}
.cues span{font-family:var(--display);font-stretch:78%;font-weight:850;text-transform:uppercase;font-size:18px;border:2px solid var(--ink);padding:4px 10px;line-height:1}
.cues.big span{font-size:24px;flex:1 1 auto;text-align:center;padding:10px 8px}
.problem{font-size:19px;line-height:1.35;font-weight:600;max-width:52ch;margin:4px 0 0}
.cbuild{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:10px;font-size:14px}
/* responsive */
@media (max-width:1180px){ .builder{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .builder .anal{grid-column:1/-1} }
@media (max-width:980px){ .g-main,.g3{grid-template-columns:minmax(0,1fr)} .game-hero{grid-template-columns:minmax(0,1fr)} .game-hero .r{border-left:0;border-top:1px solid var(--line)} .phone-side{display:none} }
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:20}
  .side .grp,.side .foot{display:none}
  .side button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 12px;font-size:14px}
  .side button .ct{display:none}
  .side button[aria-current="page"]{border-bottom-color:var(--tape)}
  .main{padding-inline:16px}
  .pagehead h1{font-size:34px}
  .g2,.builder{grid-template-columns:minmax(0,1fr)}
  .sect{grid-template-columns:minmax(0,1fr);gap:6px}
  .game-hero h1{font-size:38px}
  .brand .tag{display:none}
}
@media (max-width:460px){
  .phone-stage{padding:0}
  .phone{border:0;min-height:calc(100vh - 110px)}
  .roles button{padding:7px 8px;font-size:10px}
  .scenario span{display:none}
  .scenario span:nth-of-type(1){display:inline}
  .topbar{position:static;padding:8px 12px;gap:8px}
  .brand .wm{font-size:19px;white-space:nowrap}
  .roles .long{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>window.TP_DATA={"H":["ID","Game","Category","Primary Quality","Secondary Qualities","Age Range","Group Size","Duration","Equipment","Athletic Problem","Setup","Quick Explainer","Score / Win","Cue 1","Cue 2","Cue 3","Build 1 — Learn","Build 2 — Compete","Build 3 — Pressure","Build 4 — Chaos","Regression","Progression","Coach Watches","Safety / Guardrail","Value Filter","Filter Rationale","Origin","Source / Inspiration","Primary Source URL","Secondary Source URL","Status"],"rows":[["TP2-001","Mirror Escape","Chase / Escape","Deceleration & COD","Reaction & Decision; Acceleration; Spatial Awareness","8–18","2–20","5–8 min","2 cones per pair; 2 cones per field","Read an opponent’s hips, brake and redirect, then accelerate across (or cut off) an escape line.","Mark two parallel lines 6 yards apart with cones: the START line and the ESCAPE line. Cones go every 4 yards along both lines, so each pair gets a 4-yard lane. In each pair the LEADER stands on the START line facing the escape line; the MIRROR stands 2 yards in front of the leader, between the leader and the escape line, facing the leader. An odd athlete joins a pair as the judge and rotates in after each break.","Say: \"Leader slides side to side, mirror copies you step for step. When you see an opening, break for the escape line.\" Leader: slide, stop, fake, then sprint past the mirror and cross the escape line. Mirror: stay in front with open hands at belt height; if the leader breaks, chase and tag a shoulder with an open hand before the line. Each leader makes 4 breaks, then partners swap jobs. The judge calls \"crossed\" or \"tagged.\"","Leader scores 1 for crossing the escape line untagged; mirror scores 1 for a tag. Four breaks each, then swap. A touch on the shoulder or upper arm is a tag. The pair with the higher total across both jobs wins.","Read Hips","Brake Low","Burst Out","Mirror phase only: 20 seconds of half-speed copying side to side, then jog-speed breaks with no tagging, to learn the read and the brake.","Add scoring: leader point for crossing, mirror point for a tag, four breaks each.","Shorten the lane to 5 yards and give the leader 4 seconds to break (the judge counts down aloud).","The coach calls \"SWITCH\" at a random moment: the mirror instantly becomes the leader and both athletes re-read.","Walk-speed mirror, a lane 5 yards wide, and no tag: the mirror just has to stay within arm’s length at the line.","Lengthen the lane to 8 yards, or add two escape gates on the escape line and let the judge call the gate as the leader breaks.","Mirror: eyes on the belt and hips, not the feet, low and square with short shuffles (no crossed feet). Leader: a real fake before the break and an explosive first step. Both: braking in control; honest tag calls.","Open-hand tag on the shoulder or upper arm only: no grabbing, pushing or diving. The mirror stays upright and never lunges. Lanes at least 4 yards wide; 3+ yards clear beyond the escape line; non-slip floor. Stop and re-space if pairs drift into each other’s lanes.","ADMIT — V2.1","ADMIT: Read an opponent, brake, and accelerate through an open escape gate. The game creates repeated, observable deceleration & cod demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Authored V2.3 to the coach-ready card standard; not field tested.","V1 rebuilt (authored V2.3)","PE / playground / THE PROGRAM adaptation","https://www.thephysicaleducator.com/game-categories/chasing-fleeing",null,"Candidate — Coach Ready"],["TP2-002","Curved Chase","Chase / Escape","Reaction & Decision","Acceleration; Deceleration & COD; Spatial Awareness","8–18","2–20","5–8 min","8–12 cones","Hold speed on a curved path while reading and cutting off an opponent.","Create a clearly bounded 15x20-yard area for Curved Chase with enough space for all athletes to move.","Athletes solve the movement problem: Hold speed on a curved path while reading and cutting off an opponent.","1 point per successful solution; short rounds to 5.","Eyes Up","Move Clean","React Fast","Learn the base rules at controlled speed.","Add scoring.","Reduce time/space.","Add a late cue.","More space and time.","Less time and a second decision.","Decision quality and movement control.","No contact beyond light tags; keep space clear.","ADMIT — V2.1","ADMIT: Hold speed on a curved path while reading and cutting off an opponent. The game creates repeated, observable reaction & decision demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","New V2 research/adaptation","PE / playground / THE PROGRAM adaptation","https://www.thephysicaleducator.com/game-categories/chasing-fleeing",null,"Candidate — Coach Ready"],["TP2-003","Everyone Hunts","Chase / Escape","Reaction & Decision","Acceleration; Deceleration & COD; Spatial Awareness","8–18","4–20","4–8 min","4 cones; 1 pinnie per athlete","Hunt and be hunted at the same time: scan a crowd for a tail to take while protecting your own.","Mark a square about 20 x 20 yards with 4 cones (15 x 15 for 8 athletes or fewer). Every athlete tucks a pinnie into the back of the waistband so about half of it hangs out, no longer than a hand-length below the waist. The coach stands outside the square with a watch.","Say: \"Everyone has a tail. Pull a tail, get a point. Protect yours.\" On GO, move around the square and pull any tail you can reach. If your tail is pulled, pick it up, touch the nearest corner cone, re-tuck it and jump back in. Pull only the tail, never clothes, arms or hands. A late arrival tucks a pinnie and steps in at any corner.","Each athlete counts their own pulls on their fingers. Play three 60-second rounds with a 15-second breather between. After each round the coach asks who has the highest count, then says \"beat your own last round.\" Nobody is eliminated and nobody sits out.","Scan First","Protect Your Tail","Change Pace","Jog only and count nothing. Practice reaching for tails and turning away from hunters. 30-second rounds.","Full speed. Count pulls each round and try to beat your own previous round.","Shrink the square by 3 yards each round, or cut rounds to 30 seconds so every second matters.","","Jog only, a larger square, and a 5-second grace period at the start of each round when nobody can be pulled.","A smaller square, 30-second rounds, or a bonus point for pulling a tail from an athlete who has just pulled one.","Eyes up, not on feet; changes of pace and direction instead of straight lines; athletes who only protect and never hunt (give them a target); crowded corners.","Tail pulls only: no grabbing clothes, arms or hands, no pushing, no diving. Keep 3 yards between the square and any wall. Jog during LEARN. Stop everyone and re-space if the square gets crowded or two athletes collide.","ADMIT — V2.1","ADMIT: Attack and evade simultaneously while scanning a crowded space. The game creates repeated, observable reaction & decision demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Authored V2.3 to the coach-ready card standard; not field tested.","New V2 research/adaptation (authored V2.3)","PE / playground / THE PROGRAM adaptation","https://www.thephysicaleducator.com/game-categories/chasing-fleeing",null,"Candidate — Coach Ready"],["TP2-004","Flag Hunter","Chase / Escape","Reaction & Decision","Acceleration; Deceleration & COD; Spatial Awareness","8–18","2–20","5–8 min","8–12 cones; 1 pinnie per athlete; 6–10 foam pins","Protect body position while pursuing and evading multiple opponents.","Create a clearly bounded 15x20-yard area for Flag Hunter with enough space for all athletes to move.","Athletes solve the movement problem: Protect body position while pursuing and evading multiple opponents.","1 point per successful solution; short rounds to 5.","Eyes Up","Move Clean","React Fast","Learn the base rules at controlled speed.","Add scoring.","Reduce time/spa arallel lines: a CENTER line with a SCORING line 3 feet on each side (floor tape or soft ropes). Partners use neighboring lanes 2 yards apart; mark the ends of each lane with 1 cone (2 cones per pair).","On GO, both partners jump side to side over their center line at the same time, landing with BOTH feet beyond a scoring line each time. A clean landing is both feet beyond the line, balanced, with no extra step. Count your own clean left-then-right pairs aloud. A short or unstable landing does not count; keep jumping. The partner in the next lane watches and calls any miss.","1 point per clean side-to-side landing pair; first to 8 wins the heat. Play best of 3 heats against the same partner, then find a new partner.","Land Quiet","Knees Track","Own Balance","Walking tempo, one pair at a time per lane. Stick every landing for a 2-count before the next jump. No race, no points.","Race the heats as written: first to 8 clean pairs wins, best of 3.","Move the scoring lines to 4 feet apart (2 feet each side of center), or play a 20-second clock and count clean pairs.","","Scoring lines 2 feet from center, or first to 5 clean pairs.","Scoring lines 4 feet from center, a single-leg landing on every third jump, or first to 10.","Quiet landings with knees tracking over toes; no extra step before the next jump; the judge partner calling honest misses; athletes jumping farther by sacrificing balance (slow them down).","No obstacles: the lines are flat on the floor. Non-slip floor with 3 yards clear on each end of the lane. Never reward maximum distance or height; a clean landing is the only score.","ADMIT — V2.1","ADMIT: Win space with lateral power while maintaining controlled landings. The game creates repeated, observable jump & land demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by jump / land game structures; operation y, or jump with an imaginary rope.","Count 20 turns, add the SWITCH call, or lengthen the sprint to 12 yards.","Quiet landings on the balls of the feet; an honest count by the judge; the first step after dropping the rope (a drive, not a stumble); rope dropped behind the line, not thrown.","Space pairs at least 2 yards apart so ropes cannot hit anyone. The rope is dropped behind the line, never carried into the sprint. Non-slip floor and a clear sprint lane 6 yards past the gate.","ADMIT — V2.1","ADMIT: Maintain rhythm under rope then transition cleanly into a short sprint. The game creates repeated, observable jump & land demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by jump / land game structures; operational rules authored for V2.1","https://us.humankinetics.com/products/dynamic-physical-education-for-elementary-school-children-20th-edition",null,"Candidate — Coach Ready"],["TP2-038","Throw-Catch Rescue","Throw / Catch / Track","Hand-Eye & Object Control","Reaction & Decision; Spatial Awareness; Coordination & Rhythm","8–18","2–16","5–8 min","4 cones; 3 floor spots; 2 soft balls","Complete accurate passes under movement pressure to release frozen teammates.","Mark a 15 x 20 yard area with 4 cones and put 3 floor spots inside it. Two teams of 3–5: the RESCUERS and the INTERCEPTORS. Three rescuers (two if the team has only 3) start frozen, each standing on a spot. The other rescuers hold one soft ball; keep the second ball in reserve with the coach.","Say: \"Rescuers pass the ball to your frozen teammates. A clean catch frees them. Interceptors stop the passes.\" Rescuers may move without the ball but may not run while holding it: pivot and pass. A frozen teammate stays on the spot (feet fixed) and may reach for the ball. A clean catch by a frozen teammate frees them; they join in. Interceptors may knock down ttps://us.humankinetics.com/products/no-standing-around-in-my-gym","Candidate — Coach Ready"],["TP2-047","Grounder Race","Throw / Catch / Track","Hand-Eye & Object Control","Reaction & Decision; Spatial Awareness; Coordination & Rhythm","8–18","3–12","5–8 min","8 cones; 2 soft balls","Read rolling-ball angle, move feet to intercept, and transition into an accurate throw.","Make two lanes, each 10 yards long and 3 yards wide, 3 yards apart, with a cone at each corner (8 cones). In each lane stand a ROLLER at one end, a FIELDER in the middle and a CATCHER at the far end (6 yards behind the fielder), hands out as a target. Each lane has one soft ball. Extra athletes stand behind the roller and rotate in.","Say: \"Roll it, field it, throw it to the catcher.\" The fielder says \"Ready\"; the roller then rolls the ball along the ground at a slight angle left or right. The fielder moves to get behind the ball, picks it up with both hands, and throws to the catcher. After 3 rolls, rotate: roller to fielder, fielder to catcher, catcher to the back of the roller line behind the roller.","1 point for a clean field (ball in both hands with no bobble) and 1 more point if the catcher catches the throw without moving their feet. The first lane to 10 combined points wins the heat. Best of 3 heats; swap lanes between heats.","Track Early","Move Feet","Secure Clean","Straight, slow rolls. Fielder walks to the ball. The throw is a walk-up toss. No race, no points.","Two lanes race to 10 points as written, with the roller varying the angle on each roll.","The fielder starts a step off the line and the throw must leave within 3 seconds of the field (the coach counts aloud).","","A 6-yard lane and a bigger, softer ball, with straight rolls.","A 12-yard lane, faster rolls, or the fielder starts facing away and turns on the roller’s \"Roll.\"","Eyes on the ball until it is secured; feet move to get behind the ball before the hands go down; a stable base before the throw; throws aimed at the catcher’s chest, not rushed.","Soft balls only. Throw only down the lane toward the catcher, never across to another lane. Lanes stay 3 yards apart. The catcher stays put and never moves into the path of another lane.","ADMIT — V2.1","ADMIT: Read rolling-ball angle, move feet to intercept, and transition into an accurate throw. The game creates repeated, observable hand-eye & object control demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by throw / catch / track game structures; operational rules authored for V2.1","https://us.humankinetics.com/products/no-standing-around-in-my-gym","https://us.humankinetics.com/products/no-standing-around-in-my-gym","Candidate — Coach Ready"],["TP2-048","High-Low Read","Throw / Catch / Track","Hand-Eye & Object Control","Reaction & Decision; Spatial Awareness; Coordination & Rhythm","8–18","2–16","5–8 min","8–12 cones; 4–8 foam balls","Track changing ball trajectories and organize the body to receive cleanly.","Pairs work 5–8 yards apart with one foam ball and two floor spots marking left/right receive zones.","Thrower alternates high, low, left and right balls. Receiver moves feet, catches cleanly, and returns to center.","1 per clean catch; 5 consecutive catches advances distance.","Track Early","Move Feet","Secure Clean","Use predictable feeds and no defender so athletes learn the tracking solution.","Add a clear point target and matched opponent/pair.","Reduce time or add a passive defender/late target change.","Add a second legal target or changing cue only when tracking remains safe.","Use a larger/softer ball, shorter distance, and predictable trajectory.","Increase movement before contact or add a live decision after the catch/throw.","Eyes find the object early; feet organize the body; control before the next action.","Use soft balls, clear throwing lanes, and no thro ay tag at a time.","Attackers lifting their eyes to find the gap and changing speed before the defender arrives; defenders staying spread across the width instead of bunching; honest tag calls; athletes slowing down after the end line.","Two-hand touch on the shoulders only: no pushing, grabbing or diving. Keep 3 yards clear past each end line so attackers can slow down. Attackers jog back along the sideline, never across the field.","ADMIT — V2.1","ADMIT: Create and attack open space to cross defended territory without being tagged. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-059","Treasure Raid","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","12 cones; 12 beanbags; 1 pinnie per pair","Invade opponent territory, select a route, steal an object, and escape.","Mark a field 26 yards long and 15 yards wide with 12 cones: 4 corners, 4 cones for the two HOME zone lines (3 yards deep at each end) and 4 cones for a 4-yard NEUTRAL strip in the middle. Put 6 beanbags in each home zone. Two teams of 3–5; one team wears pinnies. Each team starts in its own home zone.","Raiders run into the other team’s half, take ONE beanbag from their home zone, and carry it back to their own home zone without being tagged. Anyone not carrying may tag a raider who is in their own half, with a two-hand touch on the shoulders. No tagging inside the neutral strip. A tagged raider walks the beanbag back to the home zone it came from, then restarts from their own home. No more than 2 defenders in their own home zone at once.","1 point per beanbag carried safely into your own home zone. Rounds are 4 minutes or first to 6 beanbags. Switch halves and play again.","Scan Space","Time It","Escape Fast","Defenders walk, raiders jog, and no tagging in the neutral strip. No points.","Even teams, 4-minute rounds, first to 6 beanbags.","3-minute rounds, and only 1 defender may stand in the home zone at a time.","","Defenders walk, an extra raider, and a wider neutral strip.","3-minute rounds, a narrower neutral strip, or only 1 defender allowed in the home zone.","Raiders reading which defender is closest and picking the far side; timing the dash after a defender commits; defenders spreading rather than all chasing; beanbags carried, never thrown.","Two-hand touch on the shoulders only: no pushing, grabbing or diving. Keep 3 yards clear around the field. Carry the beanbag in one hand; never throw it. Walk the beanbag back after a tag.","ADMIT — V2.1","ADMIT: Invade opponent territory, select a route, steal an object, and escape. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-060","End-Zone Keepaway","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8–12 cones; 1 pinnie per athlete; 4–8 foam balls; 6–10 foam pins","Maintain possession and create support angles to advance into scoring space.","Mark a 20x30 field with two teams of 3–5. Use cones to define scoring zones/gates appropriate to the game.","Teams keep possession by passing and score by completing a pass to a teammate moving into the opponent end zone.","1 per end-zone catch; turnover on drop, interception or out of bounds.","Scan Space","Support Early","Transition Fast","Play with a numerical advantage for offense and generous space.","Even teams, normal scoring, short rounds.","Shrink space or add a possession/time limit.","Coach introduces a second scoring option or immediate transition ball.","Increase field size and give offense an extra player.","Reduce space, remove safe possession time, or add transition scoring.","Off-ball movement; scanning before receiving; immediate reaction when possession changes.","No body checking. Use touch/tag defense and soft equipment; define boundaries clearly.","ADMIT — V2.1","ADMIT: Maintain possession and create support angles to advance into scoring space. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-061","Four-Goal Invasion","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8 cones; 1 pinnie per pair; 1 soft ball","Scan multiple scoring options and attack the least-defended space.","Mark a field 20 yards wide and 25 yards long. Make a goal in each corner with 2 cones set 3 yards apart (4 goals, 8 cones). Play 3v3 or 4v4; one team wears pinnies. Your team attacks the two goals at the far end and defends the two goals at its own end.","Advance the ball by passing; the carrier may take up to 3 steps, then must pass. Score by passing the ball through an open far goal to a teammate who catches it on the other side. Defenders may not stand inside a goal. A two-hand touch on the carrier, an intercepted pass, a dropped ball or a ball out of bounds is a turnover: the other team restarts from that spot. After a goal, restart from the center with the team that was scored on.","1 per controlled pass through an open far goal to a teammate. First to 5, or the best score at the end of the block.","Scan Space","Support Early","Transition Fast","Play with a numerical advantage for offense and generous space.","Even teams, normal scoring, short rounds.","Shrink space or add a possession/time limit.","Coach introduces a second scoring option or immediate transition ball.","Increase field size and give offense an extra player.","Reduce space, remove safe possession time, or add transition scoring.","Off-ball movement; scanning before receiving; immediate reaction when possession changes.","No body checking. Use touch/tag defense and soft equipment; define boundaries clearly.","ADMIT — V2.1","ADMIT: Scan multiple scoring options and attack the least-defended space. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-062","Gate Possession","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8–12 cones; 1 pinnie per athlete; 4–8 soft playground/foam balls; 6–10 foam pins","Keep possession while recognizing when a passing gate becomes available.","Scatter 6 two-yard cone gates in a 20x25 field. Play 3v3 or 4v4 with one soft ball.","Teams maintain possession and score by passing through a gate to a teammate on the other side. Same gate cannot score twice in a row.","1 per completed gate pass; turnover on drop/interception/out.","Scan Space","Support Early","Transition Fast","Play with a numerical advantage for offense and generous space.","Even teams, normal scoring, short rounds.","Shrink space or add a possession/time limit.","Coach introduces a second scoring option or immediate transition ball.","Increase field size and give offense an extra player.","Reduce space, remove safe possession time, or add transition scoring.","Off-ball movement; scanning before receiving; immediate reaction when possession changes.","No body checking. Use touch/tag defense and soft equipment; define boundaries clearly.","ADMIT — V2.1","ADMIT: Keep possession while recognizing when a passing gate becomes available. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-063","Numbers Advantage","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8 cones; 1 soft ball","Exploit temporary numerical advantage before defenders recover.","Mark a field 20 yards long and 15 yards wide with cones, with a start line at one end and a 3-yard end zone at the other. Run it in groups of 6: three ATTACKERS stand on the start line holding the ball; two DEFENDERS stand 8 yards ahead of them; the sixth athlete, the RECOVERY defender, waits beside the start line. If a field has more than six athletes, the extras wait at the side and rotate in as attackers.","Say: \"Three attackers against two defenders. Score before the third defender gets there.\" On GO, attackers advance by passing or by running with the ball. After the coach counts to 5 out loud, the recovery defender may sprint onto the field. A rep ends the moment the ball is carried or caught in the end zone (score), a defender tags the carrier with a two-hand touch (stop), a pass is intercepted or hits the floor (stop), the ball or carrier leaves the boundary (stop), or 12 seconds pass (stop). Rotate after every rep: the old defenders and the old recovery defender become the next attackers; the old attackers become the next defenders and recovery. The new attackers walk the ball back to the start line.","Attackers score 1 for getting the ball into the end zone, by carrying or catching it. Defenders score 1 for every stop. Play 6 reps. Group goal: attackers score on at least 4 of the 6. When several fields run at once, compare totals.","Scan Space","Support Early","Attack Now","3v1 at jog pace with no recovery defender, so attackers learn to spot the open teammate.","3v2 with the recovery defender entering at a count of 5, six reps, standard scoring.","The recovery defender enters at a count of 3, or the field shortens to 15 yards.","The coach secretly picks the recovery defender’s entry time (2 to 5 seconds), so attackers cannot predict it.","3v1 with no recovery defender, a wider field, and no time limit.","Recovery defender enters at 3 seconds, or play 4v3 on a longer field.","Attackers spreading wide and using all three; the carrier looking up before running and passing before defenders close; defenders talking about who takes the ball; the recovery defender taking an angle, not a straight chase.","Two-hand touch on the shoulders or waist only: no pushing, grabbing or diving. Soft ball only; pass underhand or chest-high, never at faces. Keep 3 yards clear beyond the end zone and the sidelines.","ADMIT — V2.1","ADMIT: Exploit temporary numerical advantage before defenders recover. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-064","Transition Race","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8 cones; 1 pinnie per pair; 3 soft balls","Instantly switch from attack to defense when possession changes.","Mark a 20 x 25 yard field with 4 corner cones and a scoring gate (2 cones, 3 yards apart) at each end. Play 3v3; one team wears pinnies. Keep 2 spare balls at midfield. Each team attacks the gate at the far end and defends the gate at its own end.","Advance by passing; the carrier may pivot but may not run. Score by passing through the far gate to a teammate who catches it beyond the gate. When possession changes (a two-hand tag on the carrier, an interception, a drop or the ball out), the team that lost the ball turns and defends its own gate immediately, and the team that won it attacks the other way. After a score, the coach rolls a fresh ball to the team that was scored on so play never stops.","1 per pass through the far gate. After each score the coach serves a fresh ball to the team that was scored on so the transition starts at once. Play first to 5 or the block time.","Scan Space","Support Early","Transition Fast","Play with a numerical advantage for offense and generous space.","Even teams, normal scoring, short rounds.","Shrink space or add a possession/time limit.","Coach introduces a second scoring option or immediate transition ball.","Increase field size and give offense an extra player.","Reduce space, remove safe possession time, or add transition scoring.","Off-ball movement; scanning before receiving; immediate reaction when possession changes.","No body checking. Use touch/tag defense and soft equipment; define boundaries clearly.","ADMIT — V2.1","ADMIT: Instantly switch from attack to defense when possession changes. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-065","Corner Capture","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8–12 cones; 1 pinnie per athlete; 4–8 soft playground/foam balls; 6–10 foam pins","Move off-ball to create a passing lane into a defended corner.","Mark a 20 x 20 yard field. In each corner place a 3 x 3 yard box (4 cones per box, 16 cones). Make two teams of 3–4 and put one team in pinnies. Each team starts at the center of the field; one team starts with the ball.","Say: \"Pass the ball to a teammate who catches it inside an open corner box.\" The carrier may take up to 3 steps, then must pass. A catch inside an unoccupied box scores. You cannot score in the same corner twice in a row. At most one defender may stand in a box. Turnover when the ball is dropped, intercepted, goes out of bounds, the carrier takes more than 3 steps, or a defender tags the carrier with a two-hand touch. The other team restarts at the center.","1 point per catch inside an open corner box. A round ends at 5 points or after 3 minutes, whichever comes first. Swap pinnies and play again. If the score is tied at the end, the next point wins.","Scan Space","Support Early","Transition Fast","4v3 with the defenders only blocking boxes and no tagging. Walk the first rep.","Even teams, 3-minute rounds, standard scoring.","A 15 x 15 yard field, or the carrier gets 2 steps instead of 3.","","A bigger field with an extra attacker, and no tagging.","A smaller field, 2 steps for the carrier, or add a rule that a second catch in the same corner within a round costs a point.","Off-ball athletes moving into space and calling for the ball; the carrier scanning before the third step; defenders blocking boxes rather than chasing; fast restarts after a turnover.","Two-hand touch on the shoulders only: no body checking. Soft balls only; throw to chest height, never at faces. Keep 3 yards clear around the field. Defenders do not jump into receivers.","ADMIT — V2.1","ADMIT: Move off-ball to create a passing lane into a defended corner. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-066","Territory Pickoff","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8 cones; 3 beanbags; 1 pinnie per pair","Advance objects through defended zones while teammates create space.","Mark a field 24 yards long and 12 yards wide, split by cones into three 8-yard zones: ZONE 1 (start), ZONE 2 (defended), ZONE 3 (home). Put 3 beanbags on the floor in Zone 1. Two teams of 3–5. The ATTACKERS start in Zone 1; the DEFENDERS start in Zone 2. One team wears pinnies (pinnies stay with the team when roles switch).","Say: \"Attackers: move all 3 beanbags from Zone 1 to Zone 3 by passing. Nobody runs with a beanbag. Defenders: stay in Zone 2 and send them back.\" The carrier may NOT run: they may pivot but must pass or hand the beanbag off within 3 seconds (the coach counts aloud). Attackers without a beanbag may run anywhere, including Zone 2. Defenders must stay inside Zone 2. They may tag the carrier (two-hand touch on the shoulders) or knock down or catch a tossed beanbag. A tag, interception or dropped beanbag sends that beanbag back to Zone 1 and the attack carries on. A beanbag is delivered when an attacker catches it inside Zone 3 and sets it on the home line.","Attackers score 1 per delivered beanbag. Defenders score 1 per beanbag sent back. A round ends when all 3 beanbags are delivered or after 2 minutes, then the teams switch roles. Play 2 rounds each; the team with more total points wins.","Scan Space","Pass Early","Fill Space","5 attackers vs. 2 defenders, a 5-second hold, and no tagging (defenders only intercept).","Even teams, standard scoring, 2-minute rounds.","The carrier must pass within 2 seconds and rounds shorten to 90 seconds.","Once per round the coach calls \"PRESS\": defenders may step into Zone 3 for 5 seconds.","More attackers than defenders, a 5-second hold, and no tagging: interceptions only.","A 2-second hold, a fourth beanbag, or only 2 defenders inside Zone 2 at a time.","Attackers creating open space and calling for the beanbag; carriers looking up and passing early; defenders spreading out instead of crowding the carrier; honest tag calls.","Two-hand touch on the shoulders only: no body contact, grabbing or diving. Underhand tosses, never at faces. Defenders do not jump into a carrier. Keep 3 yards clear around the field.","ADMIT — V2.1","ADMIT: Advance objects through defended zones while teammates create space. The game creates repeated, observable spatial awareness demands with a decision or coordination problem, explicit rules/scoring, and scalable constraints. Field validation still required.","V2.1 individual coach-ready rewrite","THE PROGRAM adaptation informed by invasion / territory game structures; operational rules authored for V2.1","https://www.thephysicaleducator.com/game-categories/invasion",null,"Candidate — Coach Ready"],["TP2-067","No-Dribble Invasion","Invasion / Territory","Spatial Awareness","Reaction & Decision; Acceleration; Deceleration & COD","9–18","6–20","7–10 min","8–12 nd?"],["Value Filter — Scalability","Can the game be meaningfully adapted across ages, abilities, spaces, or group sizes?"],["North Star","The athlete experiences play. The coach understands why the game is there."],["Copyright rule","Use published resources as research/inspiration. Do not copy copyrighted game descriptions verbatim; create THE PROGRAM instructions and adaptations."],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],["V2.1 Coach-Ready Standard",null],["One game = one distinct movement problem/ruleset","Builds never inflate game count."],["Library admission","Passes athletic-value screen and is usable enough to test."],["Field validation","Earned from real testing; never implied by workbook admission."],["Primary Quality","Dominant athletic problem, reviewed game-by-game."],["Secondary Qualities","Meaningful additional demands, not incidental movement."],["Setup","Specific enough to build the activity."],["Quick Explainer","Actual rules, not a restatement of the athletic problem."],["Score / Win","Real scoring/completion rule when competition is appropriate."],["Builds","Learn → Compete → Pressure → Chaos only when each genuinely helps."],["Safety","Game-specific guardrails; no blindfold requirement or maximal partner-force contests."]],"sources":[["Source","Why it matters to V2","URL"],["No Standing Around in My Gym","REQUIRED source. 6 units, 70 games, 39 variations; emphasizes full participation, movement skills, creative thinking and cooperation. Public contents include ball handling/manipulative skills, body awareness/movement exploration, cooperative activities, jump rope, striking/kicking, traditional-game twists and sport-based activities.","https://us.humankinetics.com/products/no-standing-around-in-my-gym"],["ThePhysicalEducator PE Games Database","54 tested games across chasing/fleeing, invasion, FMS, net/wall, health/fitne function parseText(g){

   Rule: simultaneous stations never exceed coaches (stations are coached by default; a self-directed station would have to be explicitly designed and approved — none are).
   One rotation = k stations at once, every group visits every station: rounds = k. R rotations → k×R rounds.
   Per round: m minutes of play, t minutes of changeover between rounds, so rounds×m + (rounds−1)×t = BUILD minutes (exact).
   ASSUMPTIONS: slots under 8 min are flagged (rotation overhead); slots over 14 min are not offered. 4–6 athletes per station is the preferred default, not a rule. */
const MIN_SLOT = 8, MAX_SLOT = 14;
function extraRole(emph){ const q = (emph||[])[0]; if (!q) return 'MOVE';
  if (['Reaction & Decision-Making','Coordination & Rhythm','Spatial Awareness'].includes(q)) return 'SOLVE';
  if (['Throw / Catch / Track','Strike / Kick / Object Control'].includes(q)) return 'CONTROL'; return 'MOVE'; }
function roleSeq(rounds, emph){ const base = ROLE_KEYS.slice(); const ex = extraRole(emph); const order = [...base, ex, ...base.filter(r=>r!==ex), ...base];
  return Array.from({length:rounds}, (_,i)=>order[i]); }
function slotMath(B, rounds){ for (const t of [0,1,2,3]){ const m = (B-(rounds-1)*t)/rounds; if (Number.isInteger(m) && m>=5) return {m, t}; }
  const t = 1, m = Math.floor((B-(rounds-1)*t)/rounds); return {m, t, short:true, leftover:B-(rounds*m+(rounds-1)*t)}; }
function buildConfigs(tpl, n, emph, coaches){
  const B = +tpl.phases.build||0; const C = Math.max(1, Math.floor(+coaches||3)); const out = [];
  if (tpl.oneGroup || n<=5){ const m = Math.floor(B/3); return [{id:'one', label:`One group · MOVE → SOLVE → CONTROL · ${m} min each`, rots:null, roles:ROLE_KEYS.slice(), min:m, t:0, size:n, minSize:n, k:1, rounds:3, r:1, total:m*3, coachesNeeded:1, cost:0, reason:`${n} athletes: one group, no rotation.`}]; }
  for (let k=1; k<=Math.min(C,6); k++) for (let r=1; r<=6; r++){ const rounds = k*r; if (rounds<3 || rounds>6) continue;
    if (k===1 && r!==3 && r!==6) continue;
    const sm = slotMath(B, rounds); if (sm.m<5 || sm.m>MAX_SLOT) continue;
    const seq = roleSeq(rounds, emph); const rots = Array.from({length:r}, (_,ri)=>seq.slice(ri*k, ri*k+k));
    const size = Math.ceil(n/k), minSize = Math.floor(n/k);
    const dev = Math.max(0, STATION_DEFAULT[0]-minSize) + Math.max(0, size-STATION_DEFAULT[1]);
    const short = sm.m<MIN_SLOT ? MIN_SLOT-sm.m : 0;
    const cost = 2*dev + short + (r-1)*1.5 - .3*rounds;
    const label = k===1 ? `One group at a time · ${rounds} slots × ${sm.m} min` : `${k} station${k>1?'s':''} at once${r>1?` × ${r} rotations`:''} × ${sm.m} min${sm.t?` (+${sm.t}-min changeovers)`:''}`;
    out.push({id:`${k}x${r}`, rots: k===1?null:rots, roles: k===1?seq:undefined, min:sm.m, t:sm.t, k, r, rounds, size: k===1?n:size, minSize: k===1?n:minSize, total:rounds*sm.m+(rounds-1)*sm.t, coachesNeeded:k, cost, short:sm.m<MIN_SLOT, label,
      leftover: sm.leftover||0, reason:`${n} athletes ÷ ${k} station${k>1?'s':''} = ${k===1?n:(minSize===size?size:minSize+'–'+size)} per station; ${rounds} rounds × ${sm.m} min${sm.t?` + ${(rounds-1)}×${sm.t} min changeover`:''}`}); }
  if (!out.length){ const m = Math.floor(B/3); out.push({id:'one', label:`One group · MOVE → SOLVE → CONTROL · ${m} min each`, rots:null, roles:ROLE_KEYS.slice(), min:m, t:0, size:n, minSize:n, k:1, rounds:3, r:1, total:m*3, coachesNeeded:1, cost:9, reason:'No rotation fits this length and staffing.'}); }
  out.forEach(c=>{ c.flag = c.k>1 && (c.size>STATION_DEFAULT[1] || c.minSize<STATION_DEFAULT[0]) ? {size:c.minSize===c.size?c.size:c.minSize+'–'+c.size, pref:STATION_DEFAULT.join('–'), why:`${n} athletes / ${C} available coach${C>1?'es':''}`} : null; });
  return out.sort((a,b)=>a.cost-b.cost || a.k-b.k);
}
function pickConfig(cfgs){ return cfgs[0]; }
function architecture(tpl, n, cfgId, emph, coaches){
  const cfgs = buildConfigs(tpl, n, emph, coaches); const cfg = cfgs.find(c=>c.id===cfgId) || pickConfig(cfgs);
  const blocks = [], seen = {}; let lastBuild = -1;
  const mkB = (role, rot) => { const c = seen[role] = (seen[role]||0)+1; return {phase:'build', role, rot, trans:cfg.t||0, label:role+(c>1?' '+c:''), min:cfg.min, rule:ROLES[role].rule, gameId:null, build:null, why:[]}; };
  for (const p of PHASES){
    if (p.k!=='build'){ blocks.push({phase:p.k, label:p.t, min:+tpl.phases[p.k]||0, rule:p.rule, gameId:null, build:null, why:[]}); continue; }
    if (!cfg.rots) (cfg.roles||ROLE_KEYS).forEach(role => blocks.push(mkB(role, null)));
    else cfg.rots.forEach((roles, ri) => roles.forEach(role => blocks.push(mkB(role, 'R'+(ri+1)))));
    lastBuild = blocks.length-1;
  }
  if (blocks[lastBuild]) blocks[lastBuild].trans = 0;
  if (!cfg.rots) blocks.forEach(b=>{ if (b.phase==='build') b.trans = 0; });

}
